name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: Install client dependencies
        run: npm --prefix client ci
      - name: Test
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high && npm --prefix client audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm --prefix client ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
