services:
  - type: web
    name: movie-explorer
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix client ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_CONNECTION_STRING
        sync: false
      - key: OMDB_API_KEY
        sync: false
